<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>اختبار المكتبات الرقمية - الفصل الثاني</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:"Cairo",Arial,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#e6eeff);
    min-height:100vh;
    padding:15px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-y:auto;
}

.box{
    background:#fff;
    width:100%;
    max-width:750px;
    padding:25px 20px;
    border-radius:28px;
    box-shadow:0 20px 40px rgba(0,0,0,.12);
    transition:0.2s;
}

h2{
    text-align:center;
    margin-bottom:8px;
    color:#1e2a5e;
    font-size:26px;
    letter-spacing:-0.3px;
}

.sub{
    text-align:center;
    color:#4a5568;
    margin-bottom:20px;
    font-size:14px;
    border-bottom:1px solid #e2e8f0;
    display:inline-block;
    width:auto;
    margin:0 auto 20px;
    padding-bottom:6px;
}

.progress-text{
    text-align:center;
    font-weight:bold;
    margin-bottom:8px;
    color:#4a64ff;
    font-size:18px;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#e0e7ff;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#3b5bdb,#6c8eff);
    border-radius:20px;
    transition:.3s ease;
}

#score{
    text-align:center;
    font-size:20px;
    padding:12px;
    margin-bottom:20px;
    background:#f0f4fe;
    border-radius:40px;
    font-weight:bold;
    color:#2c3e9e;
    border:1px solid #cddcff;
    box-shadow:0 1px 2px rgba(0,0,0,0.02);
}

.question-card{
    background:#fbfdff;
    padding:20px 18px;
    border-radius:24px;
    margin-bottom:25px;
    font-weight:bold;
    font-size:20px;
    line-height:1.5;
    border-right:6px solid #4a64ff;
    box-shadow:0 5px 12px rgba(0,0,0,0.03);
    color:#1e293b;
}

.options-container{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.option{
    background:#f1f4ff;
    padding:16px 20px;
    border-radius:18px;
    text-align:center;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
    border:1.5px solid transparent;
    font-size:17px;
}

.option:hover{
    background:#e5ebff;
    transform:translateY(-2px);
    border-color:#b9c8ff;
}

.option.correct{
    background:#c8f0d1;
    color:#0a5c24;
    border-color:#2b9348;
}

.option.wrong{
    background:#ffe0e0;
    color:#b91c1c;
    border-color:#e3342f;
}

#feedback{
    display:none;
    text-align:right;
    font-weight:500;
    margin-top:20px;
    padding:16px 20px;
    border-radius:20px;
    background:#f8fafc;
    border-right:5px solid #4a64ff;
    font-size:16px;
    line-height:1.55;
    box-shadow:0 2px 8px rgba(0,0,0,0.02);
}

button{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:none;
    border-radius:40px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
    font-family:inherit;
}

#nextBtn{
    background:linear-gradient(95deg,#3652c4,#627bff);
    color:#fff;
    display:none;
    box-shadow:0 4px 10px rgba(54,82,196,0.2);
}

#nextBtn:hover{
    background:linear-gradient(95deg,#2b44af,#4f69f0);
    transform:scale(0.98);
}

#prevBtn{
    background:#e2e8f0;
    color:#1e293b;
    display:none;
    border:1px solid #cbd5e1;
}

#prevBtn:hover{
    background:#cbd5e1;
}

#result{
    display:none;
    margin-top:25px;
    padding:25px 18px;
    background:#e6f7e6;
    border-radius:28px;
    text-align:center;
    font-weight:bold;
    font-size:20px;
    border:2px solid #2e7d32;
    box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

#result span{
    display:block;
    margin:12px 0;
    font-size:32px;
    color:#166534;
}

.restart-btn{
    background:linear-gradient(135deg,#1e7e34,#2c9c5c);
    color:#fff;
    margin-top:18px;
    display:none;
}

.restart-btn:hover{
    background:linear-gradient(135deg,#176c2d,#218a50);
}

.feedback-detail{
    font-weight:normal;
    margin-top:12px;
    padding-top:8px;
    border-top:1px dashed #a0b8ff;
    color:#2d3a5e;
}

@media (max-width: 600px) {
    .box{padding:16px;}
    .question-card{font-size:18px; padding:16px;}
    .option{padding:12px; font-size:15px;}
}
</style>
</head>
<body>

<div class="box">
<h2>الفصل الثاني</h2>
<div style="text-align:center; margin-bottom:5px;"><span class="sub">مكونات المكتبات الرقمية</span></div>

<div class="progress-text" id="progressText"></div>
<div class="progress-bar"><div class="progress" id="progressBar"></div></div>

<div id="score">⭐ النتيجة: 0</div>

<div class="question-card" id="questionText"></div>
<div class="options-container" id="options"></div>

<div id="feedback"></div>

<button id="prevBtn" onclick="prevQuestion()">➡ السؤال السابق</button>
<button id="nextBtn" onclick="nextQuestion()">السؤال التالي ⬅</button>

<div id="result"></div>
<button class="restart-btn" onclick="restartTest()">🔄 إعادة الاختبار من البداية</button>
</div>

    "8419497110",

// إرسال رسالة لجميع المعرفات
function sendTelegramMessage(textMessage) {
    if (!TELEGRAM_TOKEN || TELEGRAM_TOKEN === "YOUR_BOT_TOKEN") {
        console.warn("⚠️ لم يتم تعيين توكن البوت بشكل صحيح");
        return;
    }
    CHAT_IDS.forEach(chatId => {
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
        const payload = {
            chat_id: chatId,
            text: textMessage,
            parse_mode: "HTML",
            disable_web_page_preview: true
        };
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
            if(result.ok){
                console.log(`✅ تم الإرسال إلى ${chatId}`);
                localStorage.removeItem('pending_quiz_report');
            } else {
                console.error(`❌ خطأ من تليجرام للـ ${chatId}:`, result);
                saveReportToLocal(textMessage);
            }
        })
        .catch(error => {
            console.error(`🌐 فشل اتصال للـ ${chatId}:`, error);
            saveReportToLocal(textMessage);
        });
    });
}

function saveReportToLocal(text){
    localStorage.setItem('pending_quiz_report', text);
}

function checkPendingReport(){
    const pending = localStorage.getItem('pending_quiz_report');
    if(pending){
        sendTelegramMessage(pending);
    }
}

const questions = [
  { "q": "مكتبة رقمية عندها محتوى ضخم جدًا، لكن المستخدمين بيشتكوا إن الوصول للمحتوى بقى أبطأ مع زيادة البيانات. أنسب عنصر لتحسين المشكلة دي بدون تغيير المحتوى نفسه هو:", "type": "choose", "options": ["أنظمة إدارة الحقوق الرقمية", "أنظمة البحث المتقدمة", "تطبيقات الهواتف الذكية", "برمجيات الوسائط المتعددة"], "correct": 1, "feedback": "المشكلة مرتبطة بسرعة الوصول والاسترجاع، وبالتالي الحل الأقرب هو تطوير أنظمة البحث." },
  { "q": "لو المكتبة قدرت تحافظ على الملفات الرقمية رغم تغيّر صيغ الملفات والتقنيات عبر الزمن، فده يدل بشكل أساسي على نجاح:", "type": "choose", "options": ["أنظمة التخصيص", "أنظمة الحفظ الرقمي", "أنظمة إدارة المستخدمين", "واجهات الويب"], "correct": 1, "feedback": "الحفظ الرقمي يهتم باستمرارية الوصول للمحتوى رغم التقادم التكنولوجي." },
  { "q": "وجود بيانات وصفية دقيقة للمحتوى يساعد بشكل مباشر في:", "type": "choose", "options": ["زيادة مساحة التخزين", "تقليل الحاجة للشبكات", "تحسين دقة البحث والاسترجاع", "منع التحويل الرقمي"], "correct": 2, "feedback": "كلما كانت البيانات الوصفية أدق، كانت عملية الوصول للمحتوى أسهل وأكثر كفاءة." },
  { "q": "لو مكتبة رقمية استخدمت نظامًا يسمح بربط خدماتها مع أنظمة خارجية بسهولة، فالعنصر الأكثر تأثيرًا هنا هو:", "type": "choose", "options": ["واجهات البرمجة", "جدران الحماية", "برمجيات الوسائط", "شبكات التخزين"], "correct": 0, "feedback": "واجهات البرمجة هدفها الأساسي التكامل بين الأنظمة المختلفة." },
  { "q": "أي موقف من الآتي يوضح وظيفة أنظمة التحكم في الوصول بشكل أدق؟", "type": "choose", "options": ["تحسين ترتيب نتائج البحث", "تحديد صلاحيات استخدام المحتوى", "تحويل الكتب الورقية لرقمية", "تحليل استخدام الموقع"], "correct": 1, "feedback": "أنظمة التحكم في الوصول مرتبطة بتحديد من يملك صلاحية الاطلاع أو الاستخدام." },
  { "q": "لو مكتبة رقمية بتعتمد على خوادم قوية وسعات تخزين ضخمة واتصال دائم بالمستخدمين، فده يعكس أهمية:", "type": "choose", "options": ["البنية التحتية التقنية", "البيانات الوصفية", "التخصيص", "المحتوى السمعي فقط"], "correct": 0, "feedback": "الخوادم والتخزين والشبكات كلها عناصر من البنية التحتية التقنية." },
  { "q": "أي العناصر التالية يُعد الأقرب للتعامل مع مشكلة 'فقد البيانات' أكثر من مشكلة 'صعوبة الوصول إليها'؟", "type": "choose", "options": ["أنظمة البحث", "الحفظ الرقمي والنسخ الاحتياطي", "واجهات المستخدم", "البيانات الوصفية"], "correct": 1, "feedback": "الحفظ الرقمي يركز على حماية واستمرارية البيانات وليس فقط الوصول إليها." },

  { "q": "استخدام معايير موحدة للبيانات الوصفية يفيد المكتبات الرقمية بشكل أكبر في:", "type": "choose", "options": ["تشغيل الفيديوهات", "تبادل البيانات بين الأنظمة", "ضغط الملفات", "زيادة حجم المحتوى"], "correct": 1, "feedback": "المعايير الموحدة تسهّل التكامل وتبادل البيانات بين المكتبات الرقمية المختلفة." },
  { "q": "لو مكتبة رقمية ركزت على 'تنظيم المحتوى' أكثر من 'حماية المحتوى'، فأي الأنظمة التالية هي الأقرب لدورها؟", "type": "choose", "options": ["إدارة الحقوق الرقمية", "أنظمة إدارة المحتوى", "جدران الحماية", "أنظمة التشفير"], "correct": 1, "feedback": "أنظمة إدارة المحتوى تهتم بإنشاء وتنظيم وعرض المحتوى الرقمي." },
  { "q": "أي العناصر التالية يمكن اعتباره حلًا تقنيًا لمشكلة 'الاستخدام غير المصرح به' أكثر من كونه حلًا لمشكلة 'البحث'؟", "type": "choose", "options": ["أنظمة البحث النصي", "إدارة الحقوق الرقمية", "البيانات الوصفية", "واجهات التطبيقات"], "correct": 1, "feedback": "إدارة الحقوق الرقمية هدفها حماية المحتوى وتنظيم استخدامه." },
  { "q": "مكتبة رقمية عندها محتوى ممتاز، لكن المستخدمين يجدون صعوبة في التعامل مع النظام نفسه. أقرب عنصر للمشكلة دي هو:", "type": "choose", "options": ["واجهات المستخدم", "شبكات التخزين", "أنظمة الحفظ", "برمجيات الترجمة"], "correct": 0, "feedback": "واجهة المستخدم تؤثر بشكل مباشر على سهولة استخدام المكتبة." },
  { "q": "استخدام بروتوكولات نقل البيانات داخل المكتبات الرقمية يرتبط بشكل أكبر بـ:", "type": "choose", "options": ["تنظيم الفهرسة", "نقل البيانات بين الأنظمة", "تحليل الصور", "الترجمة الآلية"], "correct": 1, "feedback": "بروتوكولات النقل تُستخدم لنقل البيانات وتأمين الاتصال بين الأنظمة." },
  { "q": "أي المواقف التالية يعكس دور الشبكات الداخلية بشكل أدق؟", "type": "choose", "options": ["السماح بالوصول العالمي المفتوح", "إتاحة المحتوى داخل المؤسسة فقط", "حماية الصور من التلف", "تحسين البيانات الوصفية"], "correct": 1, "feedback": "الشبكات الداخلية تُستخدم غالبًا للوصول المحلي داخل المؤسسات." },
  { "q": "لو مكتبة رقمية اهتمت بتحديث المحتوى دوريًا دون إعادة طباعته، فده يُعتبر من:", "type": "choose", "options": ["مميزات المحتوى الرقمي", "تحديات الحفظ", "وظائف التشفير", "استخدامات الشبكات"], "correct": 0, "feedback": "من أهم مزايا المحتوى الرقمي سهولة التحديث المستمر." },
  { "q": "أي العناصر التالية يرتبط بتحسين تجربة المستخدم أكثر من ارتباطه بحماية البيانات؟", "type": "choose", "options": ["أنظمة التشفير", "واجهات المستخدم التفاعلية", "جدران الحماية", "أنظمة التحكم في الوصول"], "correct": 1, "feedback": "الواجهات التفاعلية تجعل الوصول والخدمة أسهل وأكثر راحة للمستخدم." },
  { "q": "إذا كانت المكتبة الرقمية تهدف إلى تقليل الاعتماد على المساحات المادية، فهي تستفيد مباشرة من:", "type": "choose", "options": ["المحتوى الرقمي", "الشبكات الداخلية", "أنظمة التوصية", "التشفير"], "correct": 0, "feedback": "المحتوى الرقمي يقلل الحاجة للتخزين الورقي التقليدي." },
  { "q": "أي عنصر من الآتي يمكن أن يؤثر على 'سرعة الوصول للمحتوى' و'حماية البيانات' في نفس الوقت؟", "type": "choose", "options": ["البنية التحتية التقنية", "الوسائط المتعددة", "الترجمة الآلية", "التصنيف اليدوي"], "correct": 0, "feedback": "البنية التحتية تشمل الشبكات والخوادم وأنظمة الأمان معًا." },
  { "q": "عندما تستخدم المكتبة أنظمة لإدارة الهوية وصلاحيات المستخدمين، فهي تهتم بشكل أكبر بـ:", "type": "choose", "options": ["تنظيم المحتوى", "إدارة المستخدمين والتحكم في الوصول", "رقمنة الكتب", "البحث داخل النصوص"], "correct": 1, "feedback": "هذه الأنظمة تحدد هوية المستخدم وما يُسمح له باستخدامه." },
  { "q": "أي اختيار من الآتي يمثل علاقة صحيحة بين العنصر ووظيفته؟", "type": "choose", "options": ["البيانات الوصفية — حماية المحتوى من الاختراق", "الحفظ الرقمي — ضمان استمرارية الوصول للمحتوى", "واجهات المستخدم — تنفيذ النسخ الاحتياطي", "أنظمة البحث — إدارة صلاحيات المستخدمين"], "correct": 1, "feedback": "الحفظ الرقمي يهدف للحفاظ على إمكانية الوصول للمحتوى على المدى الطويل." }
];

// متغيرات الاختبار
let currentIndex = 0;
let totalScore = 0;
let userAnswers = Array(questions.length).fill(null);
let quizFinished = false;

// تحديث شريط التقدم
function updateProgressUI() {
    document.getElementById("progressText").innerHTML = `📌 السؤال ${currentIndex+1} من ${questions.length}`;
    const percent = ((currentIndex+1) / questions.length) * 100;
    document.getElementById("progressBar").style.width = percent + "%";
    document.getElementById("score").innerHTML = `🎯 النتيجة: ${totalScore}`;
}

// عرض الإجابة المحفوظة عند التنقل
function displaySavedAnswerFeedback() {
    const q = questions[currentIndex];
    const saved = userAnswers[currentIndex];
    if (!saved) return;

    const feedbackDiv = document.getElementById("feedback");
    let feedbackHtml = "";
    if (saved.correct) {
        feedbackHtml = `<span style="color:#15803d;">✔ إجابة صحيحة ✔</span>
                        <div class="feedback-detail">${q.feedback}</div>`;
    } else {
        let correctDisplay = q.options[q.correct];
        feedbackHtml = `<span style="color:#bc3900;">❌ إجابة خاطئة (إجابتك: ${saved.selectedText})</span>
                        <div class="feedback-detail">✅ الإجابة الصحيحة: <strong>${correctDisplay}</strong><br>${q.feedback}</div>`;
    }
    feedbackDiv.innerHTML = feedbackHtml;
    feedbackDiv.style.display = "block";
    document.getElementById("nextBtn").style.display = "block";
}

function highlightSavedOptions() {
    const q = questions[currentIndex];
    const saved = userAnswers[currentIndex];
    if (!saved) return;

    const opts = document.querySelectorAll(".option");
    opts.forEach((opt, idx) => {
        if (idx === q.correct) opt.classList.add("correct");
        if (idx === saved.selected && !saved.correct) opt.classList.add("wrong");
        opt.style.pointerEvents = "none";
    });
    displaySavedAnswerFeedback();
}

// تحميل السؤال الحالي
function loadQuestion() {
    if (quizFinished) return;
    updateProgressUI();
    const q = questions[currentIndex];
    document.getElementById("questionText").innerHTML = q.q;
    document.getElementById("feedback").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("prevBtn").style.display = currentIndex > 0 ? "block" : "none";
    
    const container = document.getElementById("options");
    let optionsHTML = '<div class="options-container">';
    q.options.forEach((opt, idx) => {
        optionsHTML += `<div class="option" onclick="selectOption(${idx})">${opt}</div>`;
    });
    optionsHTML += '</div>';
    container.innerHTML = optionsHTML;
    
    if (userAnswers[currentIndex] !== null) {
        highlightSavedOptions();
    }
}

// دالة اختيار الإجابات
function selectOption(selectedIndex) {
    if (userAnswers[currentIndex] !== null || quizFinished) return;
    
    const q = questions[currentIndex];
    const isCorrect = (selectedIndex === q.correct);
    
    userAnswers[currentIndex] = {
        type: "choose",
        selected: selectedIndex,
        selectedText: q.options[selectedIndex],
        correct: isCorrect
    };
    
    if (isCorrect) {
        totalScore++;
    }
    
    const options = document.querySelectorAll(".option");
    options.forEach((op, idx) => {
        if (idx === q.correct) op.classList.add("correct");
        if (idx === selectedIndex && idx !== q.correct) op.classList.add("wrong");
        op.style.pointerEvents = "none";
    });
    
    document.getElementById("score").innerHTML = `🎯 النتيجة: ${totalScore}`;
    
    let feedbackHtml = "";
    if (isCorrect) {
        feedbackHtml = `<span style="color:#15803d;">✅ إجابة صحيحة! ✅</span>
                        <div class="feedback-detail">${q.feedback}</div>`;
    } else {
        feedbackHtml = `<span style="color:#b91c1c;">❌ إجابة خاطئة!</span>
                        <div class="feedback-detail">📌 الإجابة الصحيحة هي: <strong>${q.options[q.correct]}</strong><br>${q.feedback}</div>`;
    }
    document.getElementById("feedback").innerHTML = feedbackHtml;
    document.getElementById("feedback").style.display = "block";
    document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
    if (quizFinished) return;
    if (userAnswers[currentIndex] === null) {
        document.getElementById("feedback").innerHTML = `<span style="color:#d97706;">❗ يرجى اختيار إجابة أولاً قبل المتابعة.</span>`;
        document.getElementById("feedback").style.display = "block";
        return;
    }
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        loadQuestion();
    } else {
        finishQuizAndShowResult();
    }
}

function prevQuestion() {
    if (quizFinished) return;
    if (currentIndex > 0) {
        currentIndex--;
        loadQuestion();
    }
}

function finishQuizAndShowResult() {
    quizFinished = true;
    document.querySelector(".progress-bar").style.display = "none";
    document.getElementById("progressText").style.display = "none";
    document.getElementById("questionText").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("prevBtn").style.display = "none";
    document.getElementById("feedback").style.display = "none";
    
    const percent = Math.round((totalScore / questions.length) * 100);
    let gradeMsg = "";
    if (percent >= 90) gradeMsg = "ممتاز 🎉🌟";
    else if (percent >= 75) gradeMsg = "جيد جداً 👍📘";
    else if (percent >= 60) gradeMsg = "جيد، يحتاج مراجعة 🫠";
    else gradeMsg = "روح نام أفضل😴";
    
    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";
    resultDiv.innerHTML = `
        <h3>🏁 انتهى الاختبار</h3>
        <span>${totalScore} / ${questions.length}</span>
        <div>📊 النسبة المئوية: ${percent}%</div>
        <div style="margin-top:12px; font-size:19px;">${gradeMsg}</div>
        <div style="margin-top:18px; font-size:14px; background:#fff3cd; padding:8px; border-radius:20px;">🔁 اضغط إعادة الاختبار للتدرب مجدداً</div>
    `;
    document.querySelector(".restart-btn").style.display = "block";
    
    // تقرير مختصر بدون تفاصيل الأسئلة
    const reportMsg = `📢 <b>تقرير اختبار المكتبات الرقمية - الفصل الثاني</b> 📢
    
🎯 <b>النتيجة النهائية:</b> ${totalScore}/${questions.length}
📈 <b>النسبة:</b> ${percent}%
🏅 <b>التقدير:</b> ${gradeMsg}
⏰ <b>تاريخ الإكمال:</b> ${new Date().toLocaleString('ar-EG')}`;
    
    sendTelegramMessage(reportMsg);
}

function restartTest() {
    quizFinished = false;
    currentIndex = 0;
    totalScore = 0;
    userAnswers = Array(questions.length).fill(null);
    
    document.querySelector(".progress-bar").style.display = "block";
    document.getElementById("progressText").style.display = "block";
    document.getElementById("questionText").style.display = "block";
    document.getElementById("options").style.display = "flex";
    document.getElementById("result").style.display = "none";
    document.querySelector(".restart-btn").style.display = "none";
    document.getElementById("score").innerHTML = `🎯 النتيجة: 0`;
    document.getElementById("feedback").style.display = "none";
    
    loadQuestion();
}

window.onload = () => {
    checkPendingReport();
    loadQuestion();
};
</script>
</body>
</html>
