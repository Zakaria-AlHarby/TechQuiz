<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:"Cairo",Arial,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#e6eeff);
    min-height:100vh;
    padding:15px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-y:auto;
}

.box{
    background:#fff;
    width:100%;
    max-width:600px;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h2{text-align:center;margin-bottom:10px}

.progress-text{
    text-align:center;
    font-weight:bold;
    margin-bottom:8px;
    color:#4a64ff;
}

.progress-bar{
    width:100%;
    height:8px;
    background:#e0e0e0;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#4a64ff,#6a82ff);
    transition:.3s;
}

#score{
    text-align:center;
    font-size:18px;
    padding:10px;
    margin-bottom:15px;
    background:#f3f6ff;
    border-radius:10px;
    font-weight:bold;
    color:#4a64ff;
}

.question{
    background:#f8faff;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
    font-weight:bold;
}

.options-container{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.option{
    background:#e8edff;
    padding:18px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.option:hover{background:#d9e0ff}

.option.correct{background:#b6ffb6;color:#1b8a2c}
.option.wrong{background:#ffb6b6;color:#b30000}

button{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#nextBtn{
    background:linear-gradient(135deg,#4a64ff,#6a82ff);
    color:#fff;
    display:none;
}

#prevBtn{
    background:linear-gradient(135deg,#6c757d,#868e96);
    color:#fff;
    display:none;
}

#restartBtn{
    background:linear-gradient(135deg,#28a745,#20c997);
    color:#fff;
    display:none;
}

#result{
    display:none;
    margin-top:20px;
    padding:20px;
    background:#d4ffd6;
    border-radius:15px;
    text-align:center;
    font-weight:bold;
}

#feedback{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    display:none;
}

.feedback-detail{
    font-size:14px;
    margin-top:5px;
    color:#555;

</style>

  {
    "q": "اكثر انواع الشبكات انتشارا هي Lan؟",
    "options": ["صحيحة", "خاطئة"],
    "correct": 0,
    "feedback": ""
  }
];

let index = 0;
let score = 0;
let userAnswers = Array(questions.length).fill(null);

function updateProgress(){
    document.getElementById("progressText").textContent = `السؤال ${index+1} من ${questions.length}`;
    document.getElementById("progressBar").style.width = ((index+1)/questions.length)*100 + "%";
}

function loadQuestion(){
    updateProgress();

    const q = questions[index];
    document.getElementById("questionText").textContent = q.q;
    document.getElementById("feedback").style.display = "none";
    document.getElementById("feedback").innerHTML = "";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("prevBtn").style.display = index > 0 ? "block" : "none";

    const optionsContainer = document.getElementById("options");
    
    if(q.type === "text"){
        optionsContainer.innerHTML = `
            <input type="text" id="textAnswer" placeholder="اكتب إجابتك هنا..." 
                   style="width:100%; padding:15px; border-radius:12px; border:2px solid #4a64ff; 
                          font-size:18px; text-align:center; font-family:Cairo; outline:none;">
            <button onclick="checkTextAnswer()" 
                    style="background:#4a64ff; color:#fff; padding:12px; border:none; 
                           border-radius:10px; font-size:16px; cursor:pointer; margin-top:10px;">
                تأكيد الإجابة
            </button>
        `;
    } else {
        let optionsHTML = '';
        q.options.forEach((opt, i) => {
            optionsHTML += `<div class="option" onclick="selectOption(${i})">${opt}</div>`;
        });
        optionsContainer.innerHTML = optionsHTML;
    }

    if(userAnswers[index] !== null){
        showSavedAnswer();
    }
}

function selectOption(i){
    if(userAnswers[index] !== null) return;

    const q = questions[index];
    userAnswers[index] = i;
    const correct = q.correct;
    const options = document.querySelectorAll(".option");

    if(i === correct){
        score++;
    }

    options.forEach((op,idx)=>{
        if(idx === correct) op.classList.add("correct");
        if(idx === i && idx !== correct) op.classList.add("wrong");
        op.style.pointerEvents = "none";
    });

    document.getElementById("score").textContent = `النتيجة: ${score}`;
    document.getElementById("nextBtn").style.display = "block";
    
    document.getElementById("feedback").style.display = "block";
    document.getElementById("feedback").innerHTML = (i === correct) ? 
        `<span style="color:#1b8a2c">✔ إجابة صحيحة</span>` :
        `<span style="color:#b30000">❌ إجابة خاطئة - الإجابة الصحيحة: ${q.options[correct]}</span>`;
}

function checkTextAnswer(){
    if(userAnswers[index] !== null) return;
    
    const q = questions[index];
    const input = document.getElementById("textAnswer");
    let userAnswer = input.value.trim();
    
    if(userAnswer === ""){
        alert("من فضلك اكتب إجابتك أولاً");
        return;
    }
    
    let isCorrect = false;
    let compareAnswer = userAnswer;
    
    if(!q.caseSensitive){
        compareAnswer = userAnswer.toLowerCase();
    }
    
    isCorrect = q.acceptableAnswers.includes(compareAnswer);
    
    userAnswers[index] = { answer: userAnswer, correct: isCorrect };
    
    if(isCorrect){
        score++;
        input.style.borderColor = "#1b8a2c";
        input.style.background = "#b6ffb6";
        document.getElementById("feedback").innerHTML = `<span style="color:#1b8a2c">✔ إجابة صحيحة</span><div class="feedback-detail">${q.feedback || ""}</div>`;
    } else {
        input.style.borderColor = "#b30000";
        input.style.background = "#ffb6b6";
        document.getElementById("feedback").innerHTML = `<span style="color:#b30000">❌ إجابة خاطئة</span><div class="feedback-detail">الإجابة الصحيحة: ${q.acceptableAnswers.join(" أو ")}</div>`;
    }
    
    input.disabled = true;
    document.querySelector("#options button").style.display = "none";
    
    document.getElementById("score").textContent = `النتيجة: ${score}`;
    document.getElementById("feedback").style.display = "block";
    document.getElementById("nextBtn").style.display = "block";
}

function showSavedAnswer(){
    const q = questions[index];
    
    if(q.type === "text"){
        const saved = userAnswers[index];
        const input = document.getElementById("textAnswer");
        if(input && saved){
            input.value = saved.answer;
            input.disabled = true;
            if(saved.correct){
                input.style.borderColor = "#1b8a2c";
                input.style.background = "#b6ffb6";
            } else {
                input.style.borderColor = "#b30000";
                input.style.background = "#ffb6b6";
            }
            document.querySelector("#options button").style.display = "none";
            document.getElementById("feedback").style.display = "block";
            document.getElementById("feedback").innerHTML = saved.correct ? 
                `<span style="color:#1b8a2c">✔ إجابة صحيحة</span>` :
                `<span style="color:#b30000">❌ إجابة خاطئة - الصحيح: ${q.acceptableAnswers.join(" أو ")}</span>`;
            document.getElementById("nextBtn").style.display = "block";
        }
    } else {
        const correct = q.correct;
        const selected = userAnswers[index];
        const options = document.querySelectorAll(".option");
        
        options.forEach((op, idx) => {
            if(idx === correct) op.classList.add("correct");
            if(idx === selected && idx !== correct) op.classList.add("wrong");
            op.style.pointerEvents = "none";
        });
        
        document.getElementById("feedback").style.display = "block";
        document.getElementById("feedback").innerHTML = selected === correct ? 
            `<span style="color:#1b8a2c">✔ إجابة صحيحة</span>` :
            `<span style="color:#b30000">❌ إجابة خاطئة - الصحيح: ${q.options[correct]}</span>`;
        document.getElementById("nextBtn").style.display = "block";
    }
}

function nextQuestion(){
    if(index < questions.length - 1){
        index++;
        loadQuestion();
    } else {
        showResult();
    }
}

function prevQuestion(){
    if(index > 0){
        index--;
        loadQuestion();
    }
}

function showResult(){
    document.querySelector(".progress-bar").style.display = "none";
    document.getElementById("progressText").style.display = "none";
    document.getElementById("questionText").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("prevBtn").style.display = "none";
    document.getElementById("feedback").style.display = "none";

    const percent = Math.round((score/questions.length)*100);
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerHTML = `
        <h3>انتهى الاختبار</h3>
        <p style="font-size: 24px; margin: 10px 0;">${score}/${questions.length}</p>
        <p style="font-size: 20px;">نسبة النجاح: ${percent}%</p>
    `;
    document.getElementById("restartBtn").style.display = "block";
}

function restartTest(){
    index = 0;
    score = 0;
    userAnswers = Array(questions.length).fill(null);
    
    document.querySelector(".progress-bar").style.display = "block";
    document.getElementById("progressText").style.display = "block";
    document.getElementById("questionText").style.display = "block";
    document.getElementById("options").style.display = "flex";
    document.getElementById("result").style.display = "none";
    document.getElementById("restartBtn").style.display = "none";
    
    document.getElementById("score").textContent = `النتيجة: ${score}`;
    
    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
