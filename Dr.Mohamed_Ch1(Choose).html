<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>اختبار المكتبات الرقمية - الفصل الأول</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:"Cairo",Arial,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#e6eeff);
    min-height:100vh;
    padding:15px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-y:auto;
}

.box{
    background:#fff;
    width:100%;
    max-width:750px;
    padding:25px 20px;
    border-radius:28px;
    box-shadow:0 20px 40px rgba(0,0,0,.12);
    transition:0.2s;
}

h2{
    text-align:center;
    margin-bottom:8px;
    color:#1e2a5e;
    font-size:26px;
    letter-spacing:-0.3px;
}

.sub{
    text-align:center;
    color:#4a5568;
    margin-bottom:20px;
    font-size:14px;
    border-bottom:1px solid #e2e8f0;
    display:inline-block;
    width:auto;
    margin:0 auto 20px;
    padding-bottom:6px;
}

.progress-text{
    text-align:center;
    font-weight:bold;
    margin-bottom:8px;
    color:#4a64ff;
    font-size:18px;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#e0e7ff;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#3b5bdb,#6c8eff);
    border-radius:20px;
    transition:.3s ease;
}

#score{
    text-align:center;
    font-size:20px;
    padding:12px;
    margin-bottom:20px;
    background:#f0f4fe;
    border-radius:40px;
    font-weight:bold;
    color:#2c3e9e;
    border:1px solid #cddcff;
    box-shadow:0 1px 2px rgba(0,0,0,0.02);
}

.question-card{
    background:#fbfdff;
    padding:20px 18px;
    border-radius:24px;
    margin-bottom:25px;
    font-weight:bold;
    font-size:20px;
    line-height:1.5;
    border-right:6px solid #4a64ff;
    box-shadow:0 5px 12px rgba(0,0,0,0.03);
    color:#1e293b;
}

.options-container{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.option{
    background:#f1f4ff;
    padding:16px 20px;
    border-radius:18px;
    text-align:center;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
    border:1.5px solid transparent;
    font-size:17px;
}

.option:hover{
    background:#e5ebff;
    transform:translateY(-2px);
    border-color:#b9c8ff;
}

.option.correct{
    background:#c8f0d1;
    color:#0a5c24;
    border-color:#2b9348;
}

.option.wrong{
    background:#ffe0e0;
    color:#b91c1c;
    border-color:#e3342f;
}

#feedback{
    display:none;
    text-align:right;
    font-weight:500;
    margin-top:20px;
    padding:16px 20px;
    border-radius:20px;
    background:#f8fafc;
    border-right:5px solid #4a64ff;
    font-size:16px;
    line-height:1.55;
    box-shadow:0 2px 8px rgba(0,0,0,0.02);
}

button{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:none;
    border-radius:40px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
    font-family:inherit;
}

#nextBtn{
    background:linear-gradient(95deg,#3652c4,#627bff);
    color:#fff;
    display:none;
    box-shadow:0 4px 10px rgba(54,82,196,0.2);
}

#nextBtn:hover{
    background:linear-gradient(95deg,#2b44af,#4f69f0);
    transform:scale(0.98);
}

#prevBtn{
    background:#e2e8f0;
    color:#1e293b;
    display:none;
    border:1px solid #cbd5e1;
}

#prevBtn:hover{
    background:#cbd5e1;
}

#result{
    display:none;
    margin-top:25px;
    padding:25px 18px;
    background:#e6f7e6;
    border-radius:28px;
    text-align:center;
    font-weight:bold;
    font-size:20px;
    border:2px solid #2e7d32;
    box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

#result span{
    display:block;
    margin:12px 0;
    font-size:32px;
    color:#166534;
}

.restart-btn{
    background:linear-gradient(135deg,#1e7e34,#2c9c5c);
    color:#fff;
    margin-top:18px;
    display:none;
}

.restart-btn:hover{
    background:linear-gradient(135deg,#176c2d,#218a50);
}

.feedback-detail{
    font-weight:normal;
    margin-top:12px;
    padding-top:8px;
    border-top:1px dashed #a0b8ff;
    color:#2d3a5e;
}

@media (max-width: 600px) {
    .box{padding:16px;}
    .question-card{font-size:18px; padding:16px;}
    .option{padding:12px; font-size:15px;}
}
</style>
</head>
<body>

<div class="box">
<h2>الفصل الأول</h2>
<div style="text-align:center; margin-bottom:5px;"><span class="sub">المكتبات الرقمية ومعاييرها وأنواعها</span></div>

<div class="progress-text" id="progressText"></div>
<div class="progress-bar"><div class="progress" id="progressBar"></div></div>

<div id="score">⭐ النتيجة: 0</div>

<div class="question-card" id="questionText"></div>
<div class="options-container" id="options"></div>

<div id="feedback"></div>

<button id="prevBtn" onclick="prevQuestion()">➡ السؤال السابق</button>
<button id="nextBtn" onclick="nextQuestion()">السؤال التالي ⬅</button>

<div id="result"></div>
<button class="restart-btn" onclick="restartTest()">🔄 إعادة الاختبار من البداية</button>
</div>

<script>
// ======================= تكامل تليجرام API =======================
const TELEGRAM_TOKEN = "8936492066:AAGWwvPIc6jlWQKFFpQ6uzz7J-IZI6EwlOc";
const CHAT_IDS = [
    "8419497110",
    "6214504278"      
];

// إرسال رسالة لجميع المعرفات
function sendTelegramMessage(textMessage) {
    if (!TELEGRAM_TOKEN || TELEGRAM_TOKEN === "YOUR_BOT_TOKEN") {
        console.warn("⚠️ لم يتم تعيين توكن البوت بشكل صحيح");
        return;
    }
    CHAT_IDS.forEach(chatId => {
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
        const payload = {
            chat_id: chatId,
            text: textMessage,
            parse_mode: "HTML",
            disable_web_page_preview: true
        };
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
            if(result.ok){
                console.log(`✅ تم الإرسال إلى ${chatId}`);
                localStorage.removeItem('pending_quiz_report');
            } else {
                console.error(`❌ خطأ من تليجرام للـ ${chatId}:`, result);
                saveReportToLocal(textMessage);
            }
        })
        .catch(error => {
            console.error(`🌐 فشل اتصال للـ ${chatId}:`, error);
            saveReportToLocal(textMessage);
        });
    });
}

function saveReportToLocal(text){
    localStorage.setItem('pending_quiz_report', text);
}

function checkPendingReport(){
    const pending = localStorage.getItem('pending_quiz_report');
    if(pending){
        sendTelegramMessage(pending);
    }
}

// ======================= الأسئلة الجديدة (20 سؤالاً) =======================
const questions = [
  { "q": "ما السبب المباشر الذي جعل المكتبات الرقمية جزءاً أساسياً من أنظمة التعليم الإلكتروني ودعم التعلم عن بعد؟", "type": "choose", "options": ["تطبيق معيار دبلن كور في واجهات الاستخدام", "انتشار التعليم عن بعد بسبب جائحة كوفيد - 19", "انخفاض تكاليف تحديث البنية التحتية التكنولوجية للمدارس", "قدرة الطلاب على تعديل شفرات المصدر البرمجية بحرية"], "correct": 1, "feedback": "" },
  { "q": "عندما تحدث الكتاب عن دور المكتبات الرقمية في 'تعزيز البحث العلمي'، ما الميزة التي ربطها بتسهيل الوصول إلى الأبحاث والدراسات دون قيود مالية؟", "type": "choose", "options": ["أدوات الفرز البسيطة والفهارس الورقية", "توفير خوادم محلية غير متصلة بالإنترنت", "حركة الوصول المفتوح (Open Access)", "استخدام تقنيات التنقيب في البيانات الاجتماعية"], "correct": 2, "feedback": "" },
  { "q": "أيٌّ من المشروعات الدولية التالية ذكره الكتاب كنموذج للمكتبات الرقمية التي تعزز التفاهم بين الثقافات وتتيح الوصول إلى مواد ثقافية مجاناً من مختلف أنحاء العالم؟", "type": "choose", "options": ["مشروع نظام Greenstone للمؤسسات الصغيرة", "مشروع معيار PREMIS للبيانات الوصفية", "\"المكتبة الرقمية العالمية\" بالتعاون بين اليونسكو ومكتبة الكونجرس", "نظام إدارة المكتبات الآلية في الثمانينيات"], "correct": 2, "feedback": "" },
  { "q": "لتعزيز 'الشمولية' وتيسير وصول الأشخاص ذوي الإعاقة للمعلومات، أشار الكتاب إلى إتاحة تقنيات محددة كأمثلة، منها تقنية:", "type": "choose", "options": ["التشفير والأمان المتقدم", "تحويل النص إلى كلام (Text-to-Speech)", "الحفظ الرقمي طويل الأمد", "محاكيات البيئة التكنولوجية القديمة"], "correct": 1, "feedback": "" },
  { "q": "تحت بند 'مواكبة التطورات التكنولوجية'، ما التقنيات الحديثة المتوقع استخدامها مستقبلاً لتقديم تجارب غنية وتفاعلية للمستفيدين؟", "type": "choose", "options": ["قواعد البيانات الببليوغرافية والحواسيب الكبيرة القديمة", "تقنيات الواقع الافتراضي (VR) والواقع المعزز (AR)", "أنظمة إدارة المكتبات الآلية التقليدية", "أدوات الفهرسة اليدوية للمواد المطبوعة"], "correct": 1, "feedback": "" },
  { "q": "في خلاصة فقرة 'أهمية المكتبات الرقمية'، تلعب هذه المكتبات دوراً محورياً في العصر الرقمي من خلال مجالات رئيسية حددها الكتاب بـ:", "type": "choose", "options": ["تطوير الأجهزة، وتقليل العمالة، وتخفيض الضرائب", "توفير الوصول للمعلومات، ودعم التعليم والبحث، والحفاظ على التراث الثقافي", "إلغاء المكتبات التقليدية، ورقمنة التجارة، وتوسيع شبكات الاتصال", "تدريب الموظفين الإداريين، وصيانة الأرفف، وتجديد المباني المادية"], "correct": 1, "feedback": "" },
  { "q": "تشمل معايير ومبادئ إنشاء المكتبات الرقمية لضمان فعاليتها واستدامتها أربعة جوانب رئيسية حددها الكتاب وهي:", "type": "choose", "options": ["تقنية، واقتصادية، وسياسية، واجتماعية", "تقنية، وتنظيمية، وقانونية، وأكاديمية", "برمجية، وبشرية، وجغرافية، وزمنية", "فنية، وإدارية، ومالية، وصحية"], "correct": 1, "feedback": "" },
  { "q": "من المعايير التقنية للتخزين وإدارة البيانات، اشترط الكتاب استخدام أنظمة تخزين تتميز بـ:", "type": "choose", "options": ["أنها محلية فقط ومغلقة لتقليل استهلاك الشبكة", "قابلة للتوسع وموثوقة", "تعتمد على صيغة ملفات واحدة وثابتة لا تتغير", "لا تسمح بعمل نسخ احتياطية خارج المقر الرئيسي"], "correct": 1, "feedback": "" },
  { "q": "أي من تنسيقات الملفات التالية ذكرها الكتاب كأمثلة للتنسيقات المتنوعة التي يجب أن يدعمها نظام تخزين المكتبة الرقمية؟", "type": "choose", "options": ["EXE, ZIP, RAR, ISO", "PDF, ePub, JPEG, MP3", "HTML, CSS, JS, SQL", "DOCX, XLSX, PPTX, ACCESS"], "correct": 1, "feedback": "" },
  { "q": "ما المقصود بمصطلح 'التوافقية' كمعيار تقني لإنشاء المكتبات الرقمية وفقاً للكتاب؟", "type": "choose", "options": ["قدرة المكتبة على العمل بشكل مستقل بدون موظفين أو ميزانية", "استخدام معايير مفتوحة مثل دبلن كور لوصف البيانات الوصفية ودعم بروتوكولات لتبادل البيانات", "توافق مواعيد عمل المكتبة الرقمية مع الإجازات الرسمية للدولة", "تصميم واجهات مستخدم متطابقة تماماً مع الهواتف الذكية من فئة واحدة فقط"], "correct": 1, "feedback": "" },
  { "q": "بروتوكول 'OAI-PMH' الذي أشار إليه الكتاب كمعيار للتوافقية لتبادل البيانات بين المكتبات، هو اختصار لـ:", "type": "choose", "options": ["Open Archives Initiative Protocol for Metadata Harvesting", "Online Access Information Protocol for Metadata Handling", "Open Academic Internet Protocol for Management Hierarchy", "Organisation of Artificial Intelligence Protocol for Media Hosting"], "correct": 0, "feedback": "" },
  { "q": "ينص معيار 'جودة المحتوى' ضمن المعايير الأكاديمية والعلمية على ضرورة توفير المحتوى الرقمي بالتعاون مع:", "type": "choose", "options": ["محركات البحث العامة ومواقع التواصل الاجتماعي المفتوحة", "دور النشر والمؤسسات الأكاديمية المعتمدة لضمان الجودة والموثوقية", "الهواة والمستفيدين بدون قيود أو مراجعة علمية", "الشركات التجارية المتخصصة في بيع الأجهزة الذكية"], "correct": 1, "feedback": "" },
  { "q": "من مبادئ المعايير الأكاديمية والعلمية 'الوصول المفتوح'، ويشمل تشجيع نشر المحتوى متاحاً للجميع بدون قيود ودعم المبادرات المفتوحة مثل رخص:", "type": "choose", "options": ["Creative Commons (المشاع الإبداعي)", "Digital Rights Management", "Integrated Library Systems", "Open Archival Information System"], "correct": 0, "feedback": "" },
  { "q": "يشتمل معيار 'التنظيم والتصنيف' كجزء من المعايير التنظيمية والإدارية على استخدام أنظمة تصنيف وفهرسة معتمدة عالمياً مثل:", "type": "choose", "options": ["نظام دبلن كور لتطوير واجهات المستخدم", "تصنيف ديوي العشري أو تصنيف مكتبة الكونجرس", "نظام الفهارس الآلية المميكنة القديمة", "برمجيات كوها وتنسيق المجلدات على الأرفف"], "correct": 1, "feedback": "" },
  { "q": "قسّم الكتاب المكتبات الرقمية إلى أنواع متعددة تختلف باختلاف ثلاثة عناصر رئيسية هي:", "type": "choose", "options": ["الجهة المؤسسة، والجمهور المستهدف، وطبيعة المحتوى المقدم", "لغات البرمجة، وموقع الخوادم المادية، ومساحة التخزين", "أسعار الكتب، ونوع الحواسيب, وتاريخ إصدار نظام التشغيل", "عدد الموظفين، والميزانية السنوية، ومواد بناء مبنى المكتبة"], "correct": 0, "feedback": "" },
  { "q": "ما هي 'المكتبات الرقمية الوطنية' وفقاً للتعريف والوصف الوارد في الكتاب؟", "type": "choose", "options": ["مكتبات تتبع جامعات خاصة وتخدم الطلاب وأعضاء هيئة التدريس فقط", "مكتبات تُنشأ على مستوى الدولة وتستهدف جمع وحفظ التراث الرقمي والثقافي للدولة وتوفير الوصول للمواطنين والباحثين", "مستودعات برمجية مفتوحة المصدر تُدار بواسطة شركات الاتصالات المحلية", "منصات تجارية مخصصة لبيع الكتب الإلكترونية للمواطنين بأسعار مخفضة"], "correct": 1, "feedback": "" },
  { "q": "أي من الأمثلة التالية يُعد نموذجاً لـ 'المكتبات الرقمية الوطنية' كما ذُكر نصاً في الكتاب؟", "type": "choose", "options": ["مكتبة جامعة القاهرة الرقمية", "مكتبة الكونجرس الرقمية ومكتبة الإسكندرية الرقمية", "مستودع arXiv للفيزياء والرياضيات", "نظام Greenstone للمؤسسات الصغيرة"], "correct": 1, "feedback": "" },
  { "q": "تُعرف 'المكتبات الرقمية الأكاديمية والجامعية' في الكتاب بأنها مكتبات تتبع مؤسسات التعليم العالي والجامعات، وتهدف أساساً إلى:", "type": "choose", "options": ["جمع الوثائق الحكومية السرية للدولة وحمايتها من الاختراق", "دعم التعليم والبحث العلمي من خلال توفير الكتب والأبحاث الأكاديمية للطلاب والباحثين وأعضاء هيئة التدريس", "تقديم ألعاب تعليمية تفاعلية تعتمد على الواقع المعزز للأطفال", "رقمنة الصحف والمجلات الفنية اليومية والتجارية القديمة"], "correct": 1, "feedback": "" },
  { "q": "تتميز 'المكتبات الرقمية المتخصصة' عن بقية الأنواع بأنها:", "type": "choose", "options": ["تفتح أبوابها للجمهور العام بدون أي شروط أو تسجيل أو قيود موضوعية", "تركز على مجال معرفي محدد أو موضوعات معينة (مثل الطب، القانون، الهندسة)، وتخدم فئة محددة من الباحثين أو المهنيين", "تجمع التراث الثقافي لجميع دول العالم دون تفرقة أو تصنيف موضوعي", "تعتمد فقط على الفيديوهات والصور الرقمية دون إتاحة النصوص المكتوبة"], "correct": 1, "feedback": "" },
  { "q": "ما هي 'المستودعات الرقمية المؤسسية' بحسب تصنيفات الكتاب؟", "type": "choose", "options": ["منصات تجارية لبيع الكتب تملكها شركات ربحية عالمية", "أنظمة تُنشأ من قِبل مؤسسات أكاديمية أو بحثية لتجميع، وحفظ، وإتاحة الإنتاج العلمي والبحثي الصادر عن منتسبيها", "برمجيات تشفير تمنع الباحثين من نشر أعمالهم خارج جامعاتهم المحلية", "فهارس بطاقية مميكنة لإدارة عمليات الاستعارة الخارجية للمواد الورقية"], "correct": 1, "feedback": "" }
];

// متغيرات الاختبار
let currentIndex = 0;
let totalScore = 0;
let userAnswers = Array(questions.length).fill(null);
let quizFinished = false;

// تحديث شريط التقدم
function updateProgressUI() {
    document.getElementById("progressText").innerHTML = `📌 السؤال ${currentIndex+1} من ${questions.length}`;
    const percent = ((currentIndex+1) / questions.length) * 100;
    document.getElementById("progressBar").style.width = percent + "%";
    document.getElementById("score").innerHTML = `🎯 النتيجة: ${totalScore}`;
}

// عرض الإجابة المحفوظة عند التنقل
function displaySavedAnswerFeedback() {
    const q = questions[currentIndex];
    const saved = userAnswers[currentIndex];
    if (!saved) return;

    const feedbackDiv = document.getElementById("feedback");
    let feedbackHtml = "";
    if (saved.correct) {
        feedbackHtml = `<span style="color:#15803d;">✔ إجابة صحيحة ✔</span>
                        <div class="feedback-detail">${q.feedback}</div>`;
    } else {
        let correctDisplay = q.options[q.correct];
        feedbackHtml = `<span style="color:#bc3900;">❌ إجابة خاطئة (إجابتك: ${saved.selectedText})</span>
                        <div class="feedback-detail">✅ الإجابة الصحيحة: <strong>${correctDisplay}</strong><br>${q.feedback}</div>`;
    }
    feedbackDiv.innerHTML = feedbackHtml;
    feedbackDiv.style.display = "block";
    document.getElementById("nextBtn").style.display = "block";
}

function highlightSavedOptions() {
    const q = questions[currentIndex];
    const saved = userAnswers[currentIndex];
    if (!saved) return;

    const opts = document.querySelectorAll(".option");
    opts.forEach((opt, idx) => {
        if (idx === q.correct) opt.classList.add("correct");
        if (idx === saved.selected && !saved.correct) opt.classList.add("wrong");
        opt.style.pointerEvents = "none";
    });
    displaySavedAnswerFeedback();
}

// تحميل السؤال الحالي
function loadQuestion() {
    if (quizFinished) return;
    updateProgressUI();
    const q = questions[currentIndex];
    document.getElementById("questionText").innerHTML = q.q;
    document.getElementById("feedback").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("prevBtn").style.display = currentIndex > 0 ? "block" : "none";
    
    const container = document.getElementById("options");
    let optionsHTML = '<div class="options-container">';
    q.options.forEach((opt, idx) => {
        optionsHTML += `<div class="option" onclick="selectOption(${idx})">${opt}</div>`;
    });
    optionsHTML += '</div>';
    container.innerHTML = optionsHTML;
    
    if (userAnswers[currentIndex] !== null) {
        highlightSavedOptions();
    }
}

// دالة اختيار الإجابات
function selectOption(selectedIndex) {
    if (userAnswers[currentIndex] !== null || quizFinished) return;
    
    const q = questions[currentIndex];
    const isCorrect = (selectedIndex === q.correct);
    
    userAnswers[currentIndex] = {
        type: "choose",
        selected: selectedIndex,
        selectedText: q.options[selectedIndex],
        correct: isCorrect
    };
    
    if (isCorrect) {
        totalScore++;
    }
    
    const options = document.querySelectorAll(".option");
    options.forEach((op, idx) => {
        if (idx === q.correct) op.classList.add("correct");
        if (idx === selectedIndex && idx !== q.correct) op.classList.add("wrong");
        op.style.pointerEvents = "none";
    });
    
    document.getElementById("score").innerHTML = `🎯 النتيجة: ${totalScore}`;
    
    let feedbackHtml = "";
    if (isCorrect) {
        feedbackHtml = `<span style="color:#15803d;">✅ إجابة صحيحة! ✅</span>
                        <div class="feedback-detail">${q.feedback}</div>`;
    } else {
        feedbackHtml = `<span style="color:#b91c1c;">❌ إجابة خاطئة!</span>
                        <div class="feedback-detail">📌 الإجابة الصحيحة هي: <strong>${q.options[q.correct]}</strong><br>${q.feedback}</div>`;
    }
    document.getElementById("feedback").innerHTML = feedbackHtml;
    document.getElementById("feedback").style.display = "block";
    document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
    if (quizFinished) return;
    if (userAnswers[currentIndex] === null) {
        document.getElementById("feedback").innerHTML = `<span style="color:#d97706;">❗ يرجى اختيار إجابة أولاً قبل المتابعة.</span>`;
        document.getElementById("feedback").style.display = "block";
        return;
    }
    if (currentIndex < questions.length - 1) {
        currentIndex++;
        loadQuestion();
    } else {
        finishQuizAndShowResult();
    }
}

function prevQuestion() {
    if (quizFinished) return;
    if (currentIndex > 0) {
        currentIndex--;
        loadQuestion();
    }
}

function finishQuizAndShowResult() {
    quizFinished = true;
    document.querySelector(".progress-bar").style.display = "none";
    document.getElementById("progressText").style.display = "none";
    document.getElementById("questionText").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("prevBtn").style.display = "none";
    document.getElementById("feedback").style.display = "none";
    
    const percent = Math.round((totalScore / questions.length) * 100);
    let gradeMsg = "";
    if (percent >= 90) gradeMsg = "ممتاز 🎉🌟";
    else if (percent >= 75) gradeMsg = "جيد جداً 👍📘";
    else if (percent >= 60) gradeMsg = "جيد، يحتاج مراجعة 🫠";
    else gradeMsg = "يحتاج مراجعة مركزة 📖🧠";
    
    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";
    resultDiv.innerHTML = `
        <h3>🏁 انتهى الاختبار</h3>
        <span>${totalScore} / ${questions.length}</span>
        <div>📊 النسبة المئوية: ${percent}%</div>
        <div style="margin-top:12px; font-size:19px;">${gradeMsg}</div>
        <div style="margin-top:18px; font-size:14px; background:#fff3cd; padding:8px; border-radius:20px;">🔁 اضغط إعادة الاختبار للتدرب مجدداً</div>
    `;
    document.querySelector(".restart-btn").style.display = "block";
    
    // تقرير مختصر بدون تفاصيل الأسئلة
    const reportMsg = `📢 <b>تقرير اختبار المكتبات الرقمية - الفصل السادس</b> 📢
    
🎯 <b>النتيجة النهائية:</b> ${totalScore}/${questions.length}
📈 <b>النسبة:</b> ${percent}%
🏅 <b>التقدير:</b> ${gradeMsg}
⏰ <b>تاريخ الإكمال:</b> ${new Date().toLocaleString('ar-EG')}`;
    
    sendTelegramMessage(reportMsg);
}

function restartTest() {
    quizFinished = false;
    currentIndex = 0;
    totalScore = 0;
    userAnswers = Array(questions.length).fill(null);
    
    document.querySelector(".progress-bar").style.display = "block";
    document.getElementById("progressText").style.display = "block";
    document.getElementById("questionText").style.display = "block";
    document.getElementById("options").style.display = "flex";
    document.getElementById("result").style.display = "none";
    document.querySelector(".restart-btn").style.display = "none";
    document.getElementById("score").innerHTML = `🎯 النتيجة: 0`;
    document.getElementById("feedback").style.display = "none";
    
    loadQuestion();
}

window.onload = () => {
    checkPendingReport();
    loadQuestion();
};
</script>
</body>
</html>
