<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار أكمل - البروتوكولات</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:"Cairo", Arial, sans-serif;
    background:linear-gradient(135deg, #eef2ff, #e6eeff);
    min-height:100vh;
    padding:15px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-y:auto;
}

.box{
    background:#fff;
    width:100%;
    max-width:750px;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:15px;
    color:#333;
}

.progress-text{
    text-align:center;
    font-weight:bold;
    margin-bottom:8px;
    color:#4a64ff;
    font-size:18px;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#e0e0e0;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, #4a64ff, #6a82ff);
    transition:.3s;
}

#score{
    text-align:center;
    font-size:20px;
    padding:12px;
    margin-bottom:20px;
    background:#f3f6ff;
    border-radius:10px;
    font-weight:bold;
    color:#4a64ff;
    border:2px solid #e0e6ff;
}

.question{
    background:#f8faff;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;
    font-weight:bold;
    font-size:20px;
    line-height:1.6;
    border-right:5px solid #4a64ff;
}

.input-area{
    margin:15px 0 10px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
}

#userAnswer{
    flex:3;
    padding:15px;
    font-size:18px;
    border:2px solid #ccd4f0;
    border-radius:12px;
    font-family:"Cairo", Arial, sans-serif;
    text-align:right;
    background:#fff;
    transition:0.2s;
}

#userAnswer:focus{
    border-color:#4a64ff;
    outline:none;
    box-shadow:0 0 0 3px rgba(74,100,255,0.2);
}

#checkBtn{
    flex:1;
    background:#4a64ff;
    color:#fff;
    border:none;
    padding:15px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

#checkBtn:hover{
    background:#3a54ef;
}

#feedback{
    display:none;
    text-align:center;
    font-weight:bold;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#f0f4ff;
    border-right:5px solid #4a64ff;
    font-size:18px;
    line-height:1.5;
}

button{
    width:100%;
    padding:18px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

#nextBtn{
    background:linear-gradient(135deg, #4a64ff, #6a82ff);
    color:#fff;
    display:none;
}

#nextBtn:hover{
    background:linear-gradient(135deg, #3a54ef, #5a72ef);
}

#prevBtn{
    background:linear-gradient(135deg, #6c757d, #868e96);
    color:#fff;
    display:none;
}

#prevBtn:hover{
    background:linear-gradient(135deg, #5c656d, #767e86);
}

#result{
    display:none;
    margin-top:25px;
    padding:25px;
    background:#d4ffd6;
    border-radius:15px;
    text-align:center;
    font-weight:bold;
    font-size:22px;
    border:3px solid #1b8a2c;
}

#result span{
    display:block;
    margin:10px 0;
    font-size:28px;
    color:#1b8a2c;
}

.restart-btn{
    background:linear-gradient(135deg, #28a745, #20c997);
    color:#fff;
    margin-top:20px;
    display:none;
}

.restart-btn:hover{
    background:linear-gradient(135deg, #218838, #1ca87e);
}

.feedback-detail{
    font-weight:normal;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed #4a64ff;
    color:#555;
}

.correct-feedback{
    background-color:#e0ffe0;
    border-right-color:#1b8a2c;
}

.wrong-feedback{
    background-color:#ffe0e0;
    border-right-color:#b30000;
}

@media (max-width: 600px) {
    .box{padding:15px;}
    .question{font-size:18px; padding:15px;}
    #userAnswer{padding:12px; font-size:16px;}
    #checkBtn{padding:12px;}
}
</style>
</head>

<body>

<div class="box">
<h2> أكمل </h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-bar"><div class="progress" id="progressBar"></div></div>

<div id="score">النتيجة: 0</div>

<div class="question" id="questionText"></div>

<div class="input-area">
    <input type="text" id="userAnswer" placeholder="اكتب إجابتك هنا ..." autocomplete="off">
    <button id="checkBtn" onclick="checkAnswer()">✔ تحقق</button>
</div>

<div id="feedback"></div>

<button id="prevBtn" onclick="prevQuestion()">السؤال السابق</button>
<button id="nextBtn" onclick="nextQuestion()">السؤال التالي</button>

<div id="result"></div>
<button class="restart-btn" onclick="restartTest()">↻ إعادة الاختبار</button>
</div>

<script>

  },
  {
    "q": "هو نمط من أنماط التعلم الإلكتروني، يمثل بيئة تعليمية تفاعلية يتم فيها تقديم المحتوى الدراسي والمناهج والأنشطة التعليمية والتقويم بشكل كامل أو جزئي عبر شبكة الإنترنت وتطبيقات الويب المختلفة (مثل المتصفحات، المنصات التعليمية، والمواقع المتخصصة).",
    "correctAnswers": ["التعلم القائم علي الويب", "التعلم القائم على الويب", "web based learning", "wbl", "التعلم عبر الويب"],
    "feedback": "Web-Based Learning – التعلم القائم على الويب."
  }
];

// ===== دالة تطبيع النص (مرنة وقوية) =====
function normalizeText(text) {
    return text.trim()
        .toLowerCase()
        .replace(/[ًٌٍَُِّْ]/g, '')      // إزالة التشكيل
        .replace(/[ة]$/, 'ه')            // توحيد التاء المربوطة في آخر الكلمة
        .replace(/[أإآ]/g, 'ا')          // توحيد الألف
        .replace(/ى/g, 'ي')              // توحيد الألف المقصورة
        .replace(/\s+/g, ' ')            // توحيد المسافات
        .trim();
}

// ===== دالة التحقق من الإجابة (مصفوفة إجابات متعددة) =====
function isAnswerCorrect(userAnswer, correctAnswersList) {
    if (!userAnswer || userAnswer.trim() === "") return false;
    const normalizedUser = normalizeText(userAnswer);
    return correctAnswersList.some(correct => 
        normalizeText(correct) === normalizedUser
    );
}

// ===== متغيرات التحكم =====
let index = 0;
let score = 0;
let userAnswers = Array(questions.length).fill(null);
let answerStatus = Array(questions.length).fill(false);

// ===== دوال التحكم =====
function updateProgress() {
    document.getElementById("progressText").textContent = `السؤال ${index+1} من ${questions.length}`;
    document.getElementById("progressBar").style.width = ((index+1)/questions.length)*100 + "%";
}

function loadQuestion() {
    updateProgress();
    const q = questions[index];
    document.getElementById("questionText").textContent = q.q;
    document.getElementById("feedback").style.display = "none";
    
    document.getElementById("nextBtn").style.display = "block";
    document.getElementById("prevBtn").style.display = index > 0 ? "block" : "none";
    
    const inputField = document.getElementById("userAnswer");
    const checkBtn = document.getElementById("checkBtn");
    
    if (userAnswers[index] !== null) {
        inputField.value = userAnswers[index];
        inputField.disabled = true;
        checkBtn.disabled = true;
        checkBtn.style.opacity = "0.6";
        showSavedFeedback();
    } else {
        inputField.value = "";
        inputField.disabled = false;
        checkBtn.disabled = false;
        checkBtn.style.opacity = "1";
        inputField.style.borderColor = "#ccd4f0";
    }
    inputField.focus();
}

function checkAnswer() {
    if (userAnswers[index] !== null) {
        document.getElementById("feedback").innerHTML = `<span style="color:#ff9800">⚠️ لقد أجبت على هذا السؤال مسبقًا.</span>`;
        document.getElementById("feedback").style.display = "block";
        return;
    }
    
    const inputField = document.getElementById("userAnswer");
    const userText = inputField.value;
    if (userText.trim() === "") {
        document.getElementById("feedback").innerHTML = `<span style="color:#b30000">✏️ الرجاء كتابة إجابة قبل التحقق.</span>`;
        document.getElementById("feedback").style.display = "block";
        return;
    }
    
    const q = questions[index];
    const isCorrect = isAnswerCorrect(userText, q.correctAnswers);
    
    userAnswers[index] = userText.trim();
    answerStatus[index] = isCorrect;
    
    if (isCorrect) {
        score++;
    }
    document.getElementById("score").textContent = `النتيجة: ${score}`;
    
    let feedbackHtml = "";
    if (isCorrect) {
        feedbackHtml = `<span style="color:#1b8a2c">✔ إجابة صحيحة! ✅</span>
                        <div class="feedback-detail">${q.feedback}</div>`;
    } else {
        // عرض أول إجابة صحيحة كمثال
        const expectedAnswer = q.correctAnswers[0];
        feedbackHtml = `<span style="color:#b30000">❌ إجابة خاطئة!</span>
                        <div class="feedback-detail">الإجابة الصحيحة هي: <strong>${expectedAnswer}</strong><br>${q.feedback}</div>`;
    }
    document.getElementById("feedback").innerHTML = feedbackHtml;
    document.getElementById("feedback").style.display = "block";
    
    inputField.disabled = true;
    document.getElementById("checkBtn").disabled = true;
    document.getElementById("checkBtn").style.opacity = "0.6";
}

function showSavedFeedback() {
    const q = questions[index];
    const userText = userAnswers[index];
    const isCorrect = answerStatus[index];
    let feedbackHtml = "";
    if (isCorrect) {
        feedbackHtml = `<span style="color:#1b8a2c">✔ إجابة صحيحة ✅ (إجابتك: ${userText})</span>
                        <div class="feedback-detail">${q.feedback}</div>`;
    } else {
        const expectedAnswer = q.correctAnswers[0];
        feedbackHtml = `<span style="color:#b30000">❌ إجابة خاطئة (إجابتك: ${userText})</span>
                        <div class="feedback-detail">الإجابة الصحيحة هي: <strong>${expectedAnswer}</strong><br>${q.feedback}</div>`;
    }
    document.getElementById("feedback").innerHTML = feedbackHtml;
    document.getElementById("feedback").style.display = "block";
}

function nextQuestion() {
    if (userAnswers[index] === null) {
        document.getElementById("feedback").innerHTML = `<span style="color:#b30000">❗ يجب الإجابة على السؤال الحالي أولاً.</span>`;
        document.getElementById("feedback").style.display = "block";
        return;
    }
    
    if (index < questions.length - 1) {
        index++;
        const inputField = document.getElementById("userAnswer");
        const checkBtn = document.getElementById("checkBtn");
        if (userAnswers[index] === null) {
            inputField.disabled = false;
            checkBtn.disabled = false;
            checkBtn.style.opacity = "1";
        } else {
            inputField.disabled = true;
            checkBtn.disabled = true;
            checkBtn.style.opacity = "0.6";
        }
        loadQuestion();
    } else {
        showResult();
    }
}

function prevQuestion() {
    if (index > 0) {
        index--;
        const inputField = document.getElementById("userAnswer");
        const checkBtn = document.getElementById("checkBtn");
        if (userAnswers[index] === null) {
            inputField.disabled = false;
            checkBtn.disabled = false;
            checkBtn.style.opacity = "1";
        } else {
            inputField.disabled = true;
            checkBtn.disabled = true;
            checkBtn.style.opacity = "0.6";
        }
        loadQuestion();
    }
}

function showResult() {
    document.querySelector(".progress-bar").style.display = "none";
    document.getElementById("progressText").style.display = "none";
    document.getElementById("questionText").style.display = "none";
    document.getElementById("userAnswer").style.display = "none";
    document.getElementById("checkBtn").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("prevBtn").style.display = "none";
    document.getElementById("feedback").style.display = "none";
    
    const percent = Math.round((score/questions.length)*100);
    let message = "";
    if (percent >= 90) message = "🎉 ممتاز!";
    else if (percent >= 75) message = "👍 جيد جداً!";
    else if (percent >= 60) message = "📚 جيد، حاول مراجعة بعض البروتوكولات.";
    else message = "📖 لا تيأس، أعد الاختبار وراجع الإجابات.";
    
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerHTML = `
        <h3>🏁 انتهى الاختبار</h3>
        <span>${score} / ${questions.length}</span>
        <div>النسبة المئوية: ${percent}%</div>
        <div style="margin-top:15px; font-size:20px;">${message}</div>
        <div style="margin-top:20px; font-size:16px;">📌 اضغط "إعادة الاختبار" للتدرب مجدداً</div>
    `;
    document.querySelector(".restart-btn").style.display = "block";
}

function restartTest() {
    index = 0;
    score = 0;
    userAnswers = Array(questions.length).fill(null);
    answerStatus = Array(questions.length).fill(false);
    
    document.querySelector(".progress-bar").style.display = "block";
    document.getElementById("progressText").style.display = "block";
    document.getElementById("questionText").style.display = "block";
    document.getElementById("userAnswer").style.display = "block";
    document.getElementById("checkBtn").style.display = "block";
    document.getElementById("result").style.display = "none";
    document.querySelector(".restart-btn").style.display = "none";
    document.getElementById("score").textContent = `النتيجة: ${score}`;
    
    const inputField = document.getElementById("userAnswer");
    inputField.disabled = false;
    inputField.value = "";
    document.getElementById("checkBtn").disabled = false;
    document.getElementById("checkBtn").style.opacity = "1";
    
    loadQuestion();
}

// ربط Enter بالتحقق
document.getElementById("userAnswer").addEventListener("keypress", function(e) {
    if (e.key === "Enter" && userAnswers[index] === null) {
        checkAnswer();
    }
});

// بدء الاختبار
loadQuestion();
</script>
</body>
</html>
