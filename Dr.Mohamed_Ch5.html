<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الفصل الخامس </title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:"Cairo",Arial,sans-serif;
    background:linear-gradient(135deg,#eef2ff,#e6eeff);
    min-height:100vh;
    padding:15px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-y:auto;
}

.box{
    background:#fff;
    width:100%;
    max-width:700px;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:15px;
    color:#333;
}

.progress-text{
    text-align:center;
    font-weight:bold;
    margin-bottom:8px;
    color:#4a64ff;
    font-size:18px;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#e0e0e0;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:20px;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#4a64ff,#6a82ff);
    transition:.3s;
}

#score{
    text-align:center;
    font-size:20px;
    padding:12px;
    margin-bottom:20px;
    background:#f3f6ff;
    border-radius:10px;
    font-weight:bold;
    color:#4a64ff;
    border:2px solid #e0e6ff;
}

.question{
    background:#f8faff;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;
    font-weight:bold;
    font-size:20px;
    line-height:1.6;
    border-right:5px solid #4a64ff;
}

.options-container{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.option{
    background:#e8edff;
    padding:18px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    border:2px solid transparent;
}

.option:hover{
    background:#d9e0ff;
    transform:translateY(-2px);
}

.option.correct{
    background:#b6ffb6;
    color:#1b8a2c;
    border-color:#1b8a2c;
}

.option.wrong{
    background:#ffb6b6;
    color:#b30000;
    border-color:#b30000;
}

.truefalse-container{
    display:flex;
    gap:20px;
    justify-content:center;
}

.tf-option{
    flex:1;
    background:#e8edff;
    padding:18px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    border:2px solid transparent;
}

.tf-option:hover{
    background:#d9e0ff;
    transform:translateY(-2px);
}

.tf-option.correct{
    background:#b6ffb6;
    color:#1b8a2c;
    border-color:#1b8a2c;
}

.tf-option.wrong{
    background:#ffb6b6;
    color:#b30000;
    border-color:#b30000;
}

#feedback{
    display:none;
    text-align:center;
    font-weight:bold;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#f0f4ff;
    border-right:5px solid #4a64ff;
    font-size:18px;
    line-height:1.5;
}

button{
    width:100%;
    padding:18px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

#nextBtn{
    background:linear-gradient(135deg,#4a64ff,#6a82ff);
    color:#fff;
    display:none;
}

#nextBtn:hover{
    background:linear-gradient(135deg,#3a54ef,#5a72ef);
}

#prevBtn{
    background:linear-gradient(135deg,#6c757d,#868e96);
    color:#fff;
    display:none;
}

#prevBtn:hover{
    background:linear-gradient(135deg,#5c656d,#767e86);
}

#result{
    display:none;
    margin-top:25px;
    padding:25px;
    background:#d4ffd6;
    border-radius:15px;
    text-align:center;
    font-weight:bold;
    font-size:22px;
    border:3px solid #1b8a2c;
}

#result span{
    display:block;
    margin:10px 0;
    font-size:28px;
    color:#1b8a2c;
}

.restart-btn{
    background:linear-gradient(135deg,#28a745,#20c997);
    color:#fff;
    margin-top:20px;
    display:none;
}

.restart-btn:hover{
    background:linear-gradient(135deg,#218838,#1ca87e);
}

.feedback-detail{
    font-weight:normal;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed #4a64ff;
    color:#555;
}

@media (max-width: 600px) {
    .box{padding:15px;}
    .question{font-size:18px; padding:15px;}
    .option, .tf-option{padding:14px; font-size:16px;}
    .truefalse-container{flex-direction:column;}
}
</style>
</head>

<body>

<div class="box">
<h2>📚 الفصل الخامس</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-bar"><div class="progress" id="progressBar"></div></div>

<div id="score">النتيجة: 0</div>

<div class="question" id="questionText"></div>
<div class="options-container" id="options"></div>

<div id="feedback"></div>

<button id="prevBtn" onclick="prevQuestion()">⬅ السؤال السابق</button>
<button id="nextBtn" onclick="nextQuestion()">السؤال التالي ➡</button>

<div id="result"></div>
<button class="restart-btn" onclick="restartTest()">🔄 إعادة الاختبار</button>
</div>

<script>
// ==================== إعدادات تليجرام ====================
const TELEGRAM_TOKEN = "8936492066:AAGWwvPIc6jlWQKFFpQ6uzz7J-IZI6EwlOc";
const CHAT_IDS = [
    "8419497110"     
];

function sendTelegramMessage(textMessage){
    CHAT_IDS.forEach(chatId => {
        const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
        const payload = {
            chat_id: chatId,
            text: textMessage,
            parse_mode: "HTML"
        };
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(result => {
            if(result.ok){
                console.log(`✓ تم الإرسال إلى ${chatId} بنجاح`);
                localStorage.removeItem('pending_telegram_quiz');
            } else {
                console.error(`خطأ في الإرسال إلى ${chatId}:`, result);
                saveToLocalStorage(textMessage);
            }
        })
        .catch(error => {
            console.error(`فشل الاتصال عند الإرسال إلى ${chatId}:`, error);
            saveToLocalStorage(textMessage);
        });
    });
}

function saveToLocalStorage(text){
    localStorage.setItem('pending_telegram_quiz', text);
}

function checkPendingData(){
    const pendingText = localStorage.getItem('pending_telegram_quiz');
    if(pendingText){
        sendTelegramMessage(pendingText);
    }
}

// ==================== أسئلة الفصل الخامس ====================
const questions = [
  // اختر من متعدد
  { type: "choose", q: "ما هو المفهوم الجوهري لحركة الوصول المفتوح (Open Access) في سياق البحث العلمي؟",
    options: ["إتاحة الإنتاج العلمي والأكاديمي مجاناً عبر الإنترنت للمستفيدين دون قيود مالية أو تراخيص معقدة.", "السماح للباحثين ببيع أبحاثهم بأسعار مرتفعة للجامعات الحكومية.", "اقتصار قراءة الأبحاث العلمية على أعضاء هيئة التدريس.", "إجبار الباحثين على نشر أعمالهم بدون أسماء."],
    correct: 0, feedback: "الهدف الأسمى للوصول المفتوح هو كسر الحواجز المالية (جدران الدفع) أمام القراء والباحثين لنشر المعرفة عالمياً." },
  { type: "choose", q: "عندما يقوم الباحث بالنشر مباشرة في مجلة علمية ذات وصول مفتوح تتيح النص الكامل فوراً على موقعها مجاناً للجميع، فإن هذا يُعرف بـ:",
    options: ["الطريق الذهبي (Gold OA)", "الحجب الرقمي", "الطريق النحاسي", "القرصنة الإلكترونية"],

  { type: "choose", q: "تفرض بعض مجلات الطريق الذهبي رسوماً مادية على الباحثين لتغطية تكاليف التحكيم والنشر بدلاً من فرضها على القراء، وتُسمى هذه الرسوم علمياً اختصاراً بـ:",
    options: ["APC (Article Processing Charges)", "CPU", "RAM", "URL"],

  { type: "choose", q: "أي من الخيارات التالية يمثل مستودعاً رقمياً موضوعياً (Subject Repository) متخصصاً في مجال معين وليس تابعاً لجامعة محددة؟",
    options: ["arXiv (المتخصص في الفيزياء والرياضيات وعلوم الحاسب)", "موقع فيسبوك", "برنامج ميكروسوفت وورد", "سجل الحضور الورقي"],
    correct: 0, feedback: "مستودع arXiv هو أشهر مستودع موضوعي عالمي لإيداع مسودات الأبحاث في تخصصات علمية محددة." },
  { type: "choose", q: "تساهم المستودعات الرقمية المؤسسية في رفع التصنيف العالمي للجامعات من خلال آليات منها:",
    options: ["زيادة رؤية الإنتاج العلمي ورفع معدلات الاقتباس (Citations)", "منع الطلاب من استخدام محركات البحث", "استبدال الأساتذة بخوارزميات ذكاء اصطناعي", "فرض رسوم على دخول موقع الجامعة"],
    correct: 0, feedback: "معدلات الاقتباس مؤشر رئيسي في تصنيف الجامعات؛ وإتاحة الأبحاث مجاناً تزيد الاقتباس عالمياً." },
  { type: "choose", q: "لضمان قدرة محركات البحث العالمية (مثل Google Scholar) على حصاد وفهرسة محتويات المستودعات الرقمية بسهولة، تستخدم هذه المستودعات بروتوكولاً تقنياً معيارياً شهيراً يُسمى:",
    options: ["OAI-PMH", "FTP", "SMTP", "Bluetooth"],
    correct: 0, feedback: "بروتوكول OAI-PMH هو المعيار العالمي لتبادل وحصاد البيانات الوصفية بين المستودعات ومحركات البحث." },
  { type: "choose", q: "من أهم الوظائف الفنية التي يقوم بها المستودع الرقمي المؤسسي لحماية الإنتاج المعرفي على المدى الطويل هي وظيفة:",
    options: ["الحفظ الرقمي المستدام (Digital Preservation)", "تعديل نصوص الأبحاث عشوائياً", "طباعة الأبحاث على ورق بردي", "مسح الملفات القديمة شهرياً"],
    correct: 0, feedback: "المستودع ليس مجرد موقع رفع، بل منظومة أرشيفية تضمن بقاء الملفات عبر العقود." },
  { type: "choose", q: "ما الفارق الأساسي بين المستودع الرقمي والمجلة العلمية في بيئة الوصول المفتوح؟",
    options: ["المجلة تركز على التحكيم والنشر الدوري، والمستودع على الأرشفة والحفظ والإتاحة.", "المستودع يعمل بدون إنترنت والمجلة تعتمد على الأقمار الصناعية.", "المجلة تمنع اللغة العربية والمستودع يفرضها.", "لا يوجد فرق؛ هما مترادفان."],
    correct: 0, feedback: "المجلة جهة إصدار وتقييم، بينما المستودع وعاء أرشفة للمواد." },
  { type: "choose", q: "لكي تصبح المواد المودعة في المستودع الرقمي قابلة للبحث والاسترجاع الدقيق، يجب إضافة واصفات معيارية لها، ومن أشهر المعايير البسيطة:",
    options: ["Dublin Core", "نظام الألوان RGB", "أرقام جلوس الطلاب", "أوزان الحواسب المحمولة"],
    correct: 0, feedback: "معيار Dublin Core هو المعيار الأكثر انتشاراً لبساطته ومرونته في وصف الموارد الإلكترونية." },
  { type: "choose", q: "يوفر دليل المجلات ذات الوصول المفتوح الشهير عالمياً قاعدة بيانات ضخمة للتحقق من المجلات المفتوحة الرصينة، ويُعرف اختصاراً بـ:",
    options: ["DOAJ", "HTML", "HTTP", "JPEG"],
    correct: 0, feedback: "دليل DOAJ هو المرجع الأهم عالمياً للتحقق من موثوقية وجودة الدوريات العلمية مفتوحة الوصول." },
  // صواب وخطأ
  { type: "truefalse", q: "يُقصد بـ 'الطريق الأخضر' (Green OA) للوصول المفتوح أن يقوم الباحث بنشر بحثه في مجلة تقليدية ثم إيداع نسخة منه في مستودع رقمي مؤسسي أو موضوعي.",
    correctAnswer: "صح", feedback: "الطريق الأخضر يعتمد على آلية الأرشفة الذاتية (Self-Archiving) في المستودعات الرقمية." },
  { type: "truefalse", q: "المستودعات الرقمية المؤسسية (Institutional Repositories) تقتصر فقط على حفظ الكتب الترفيهية والروايات ولا علاقة لها بالإنتاج العلمي للجامعة.",
    correctAnswer: "خطأ", feedback: "المستودعات المؤسسية تُنشأ خصيصاً لتجميع وحفظ وإتاحة الإنتاج الفكري والعلمي للجامعة." },
  { type: "truefalse", q: "حركة الوصول المفتوح تلغي تماماً مفهوم حقوق الملكية الفكرية وتسمح للآخرين بسرقة الأبحاث دون ذكر المؤلف الأصلي.",
    correctAnswer: "خطأ", feedback: "الوصول المفتوح يحمي الحقوق الأدبية للمؤلف، ويلزم رخص المشاع الإبداعي بالاستشهاد بالمؤلف." },
  { type: "truefalse", q: "تعد منصة DSpace نموذجاً برمجياً تجارياً مغلق المصدر وباهظ الثمن يتطلب اشتراكاً سنوياً بالملايين.",
    correctAnswer: "خطأ", feedback: "منصة DSpace هي برمجية حرة ومفتوحة المصدر تُستخدم مجاناً لبناء المستودعات الرقمية." },
  { type: "truefalse", q: "تتيح المستودعات الرقمية المؤسسية إيداع أنواع مختلفة من المحتوى مثل الرسائل الجامعية، البحوث المنشورة، مشاريع التخرج، والمواد التعليمية الإلكترونية.",
    correctAnswer: "صح", feedback: "المستودعات تستوعب كافة الأصول الرقمية الفكرية التي تنتجها المؤسسة التعليمية." },
  { type: "truefalse", q: "تقف حركة الوصول المفتوح عائقاً أمام الطلاب ذوي الدخل المحدود وتمنعهم من الحصول على مراجع لدراستهم الجامعية.",
    correctAnswer: "خطأ", feedback: "الوصول المفتوح يمثل ديمقراطية المعرفة ويوفر للطلاب في الدول النامية وصولاً مجانياً للعلوم." },
  { type: "truefalse", q: "تفرض المجلات العلمية التجارية المغلقة (Subscription Journals) على الجامعات اشتراكات سنوية باهظة الثمن لكي يتمكن الطلاب من قراءة النصوص الكاملة للأبحاث.",
    correctAnswer: "صح", feedback: "هذا النموذج التقليدي القائم على جدران الدفع هو الذي تسبب في أزمة الأسعار وأدى لظهور الوصول المفتوح." },
  { type: "truefalse", q: "تتضمن سياسات الإيداع في المستودعات الرقمية تحديد 'فترة الحظر' (Embargo Period) يقصد بها فترة زمنية يفرضها الناشر يُمنع خلالها إتاحة النص الكامل مجاناً في المستودع.",
    correctAnswer: "صح", feedback: "فترة الحظر تستخدمها المجلات التجارية لضمان أرباح الاشتراكات قبل الإتاحة المجانية." },
  { type: "truefalse", q: "حركة الوصول المفتوح تساهم بقوة في تسريع وتيرة الابتكار والتقدم العلمي والتقني في المجتمع الأكاديمي والعالمي.",
    correctAnswer: "صح", feedback: "عندما تتاح المعرفة للجميع فوراً، يمكن للعلماء البناء عليها بسرعة دون تكرار الجهود." },
  { type: "truefalse", q: "يُقصد بمصطلح 'الأعمال المودعة ذاتياً' (Self-Archived Works) أن يقوم نظام الحاسوب بتأليف أبحاث علمية تلقائياً دون أي تدخل بشرى.",
    correctAnswer: "خطأ", feedback: "الأعمال المودعة ذاتياً هي أبحاث حقيقية يكتبها الباحثون ويقومون برفعها بأنفسهم في المستودعات." }
];

let index = 0;
let score = 0;
let userAnswers = Array(questions.length).fill(null);
let quizCompleted = false;

function updateProgress() {
    document.getElementById("progressText").textContent = `السؤال ${index+1} من ${questions.length}`;
    document.getElementById("progressBar").style.width = ((index+1)/questions.length)*100 + "%";
}

function loadQuestion() {
    if(quizCompleted) return;
    updateProgress();
    const q = questions[index];
    document.getElementById("questionText").textContent = q.q;
    document.getElementById("feedback").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("prevBtn").style.display = index > 0 ? "block" : "none";
    const optionsContainer = document.getElementById("options");
    if (q.type === "choose") {
        let html = '<div class="options-container">';
        q.options.forEach((opt, i) => { html += `<div class="option" onclick="selectOption(${i})">${opt}</div>`; });
        html += '</div>';
        optionsContainer.innerHTML = html;
    } else {
        optionsContainer.innerHTML = `<div class="truefalse-container">
            <div class="tf-option" onclick="selectTrueFalse('صح')">✓ صح</div>
            <div class="tf-option" onclick="selectTrueFalse('خطأ')">✗ خطأ</div>
        </div>`;
    }
    if (userAnswers[index] !== null) showSavedAnswer();
}

function selectOption(selectedIndex) {
    if (userAnswers[index] !== null || quizCompleted) return;
    const q = questions[index];
    const isCorrect = (selectedIndex === q.correct);
    userAnswers[index] = { type: "choose", selected: selectedIndex, correct: isCorrect };
    if (isCorrect) score++;
    document.getElementById("score").textContent = `النتيجة: ${score}`;
    const options = document.querySelectorAll(".option");
    options.forEach((op, idx) => {
        if (idx === q.correct) op.classList.add("correct");
        if (idx === selectedIndex && idx !== q.correct) op.classList.add("wrong");
        op.style.pointerEvents = "none";
    });
    let fb = isCorrect ? `<span style="color:#1b8a2c">✔ إجابة صحيحة!</span>` : `<span style="color:#b30000">❌ إجابة خاطئة! الإجابة الصحيحة: ${q.options[q.correct]}</span>`;
    document.getElementById("feedback").innerHTML = fb + `<div class="feedback-detail">${q.feedback}</div>`;
    document.getElementById("feedback").style.display = "block";
    document.getElementById("nextBtn").style.display = "block";
}

function selectTrueFalse(selected) {
    if (userAnswers[index] !== null || quizCompleted) return;
    const q = questions[index];
    const isCorrect = (selected === q.correctAnswer);
    userAnswers[index] = { type: "truefalse", selected: selected, correct: isCorrect };
    if (isCorrect) score++;
    document.getElementById("score").textContent = `النتيجة: ${score}`;
    const options = document.querySelectorAll(".tf-option");
    options.forEach(op => {
        if (op.textContent.includes(q.correctAnswer)) op.classList.add("correct");
        if (op.textContent.includes(selected) && !isCorrect) op.classList.add("wrong");
        op.style.pointerEvents = "none";
    });
    let fb = isCorrect ? `<span style="color:#1b8a2c">✔ إجابة صحيحة!</span>` : `<span style="color:#b30000">❌ إجابة خاطئة! الإجابة الصحيحة: ${q.correctAnswer}</span>`;
    document.getElementById("feedback").innerHTML = fb + `<div class="feedback-detail">${q.feedback}</div>`;
    document.getElementById("feedback").style.display = "block";
    document.getElementById("nextBtn").style.display = "block";
}

function showSavedAnswer() {
    const q = questions[index];
    const saved = userAnswers[index];
    if (q.type === "choose") {
        const options = document.querySelectorAll(".option");
        options.forEach((op, idx) => {
            if (idx === q.correct) op.classList.add("correct");
            if (idx === saved.selected && !saved.correct) op.classList.add("wrong");
            op.style.pointerEvents = "none";
        });
        let fb = saved.correct ? `<span style="color:#1b8a2c">✔ إجابة صحيحة ✅</span>` : `<span style="color:#b30000">❌ إجابة خاطئة (إجابتك: ${q.options[saved.selected]})</span>`;
        document.getElementById("feedback").innerHTML = fb + `<div class="feedback-detail">${q.feedback}</div>`;
    } else {
        const options = document.querySelectorAll(".tf-option");
        options.forEach(op => {
            if (op.textContent.includes(q.correctAnswer)) op.classList.add("correct");
            if (op.textContent.includes(saved.selected) && !saved.correct) op.classList.add("wrong");
            op.style.pointerEvents = "none";
        });
        let fb = saved.correct ? `<span style="color:#1b8a2c">✔ إجابة صحيحة ✅</span>` : `<span style="color:#b30000">❌ إجابة خاطئة (إجابتك: ${saved.selected})</span>`;
        document.getElementById("feedback").innerHTML = fb + `<div class="feedback-detail">${q.feedback}</div>`;
    }
    document.getElementById("feedback").style.display = "block";
    document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
    if (userAnswers[index] === null) {
        document.getElementById("feedback").innerHTML = `<span style="color:#b30000">❗ الرجاء اختيار إجابة أولاً.</span>`;
        document.getElementById("feedback").style.display = "block";
        return;
    }
    if (index < questions.length - 1) { index++; loadQuestion(); }
    else showResult();
}

function prevQuestion() { if (index > 0) { index--; loadQuestion(); } }

function showResult() {
    quizCompleted = true;
    document.querySelector(".progress-bar").style.display = "none";
    document.getElementById("progressText").style.display = "none";
    document.getElementById("questionText").style.display = "none";
    document.getElementById("options").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("prevBtn").style.display = "none";
    document.getElementById("feedback").style.display = "none";
    const percent = Math.round((score/questions.length)*100);
    let gradeMsg = "";
    if (percent >= 90) gradeMsg = "ممتاز 🎉";
    else if (percent >= 75) gradeMsg = "جيد جداً 👍";
    else if (percent >= 60) gradeMsg = "جيد 📚";
    else gradeMsg = "روح نام أفضل 😴";
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerHTML = `<h3>🏁 انتهى الاختبار</h3><span>${score} / ${questions.length}</span><div>النسبة المئوية: ${percent}%</div><div style="margin-top:15px;">${gradeMsg}</div><div style="margin-top:20px;">📌 اضغط إعادة الاختبار للتدرب مجدداً</div>`;
    document.querySelector(".restart-btn").style.display = "block";
    
    // تقرير تليجرام مفصل
    let answersDetails = "";
    for(let i=0; i<questions.length; i++){
        const q = questions[i];
        const ua = userAnswers[i];
        if(!ua) continue;
        let userAnsText = (q.type === "choose") ? q.options[ua.selected] : ua.selected;
        answersDetails += `\n${i+1}. ${ua.correct ? "✅" : "❌"} ${q.q.substring(0,45)}... (الإجابة: ${userAnsText})`;
    }
    const now = new Date();
    const formattedDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    const reportText = `📊 <b>تقرير اختبار - الفصل الخامس </b> 📊\n\n📚 <b>المادة:</b> المستودعات الرقمية \n🎯 <b>النتيجة:</b> ${score}/${questions.length}\n📈 <b>النسبة:</b> ${percent}%\n🏅 <b>التقدير:</b> ${gradeMsg}\n⏰ <b>تاريخ الإكمال:</b> ${formattedDate}\n\n${answersDetails}\n---\nتم الإجابة على ${score} أسئلة صحيحة من ${questions.length}`;
    sendTelegramMessage(reportText);
}

function restartTest() {
    quizCompleted = false;
    index = 0;
    score = 0;
    userAnswers = Array(questions.length).fill(null);
    document.querySelector(".progress-bar").style.display = "block";
    document.getElementById("progressText").style.display = "block";
    document.getElementById("questionText").style.display = "block";
    document.getElementById("options").style.display = "flex";
    document.getElementById("result").style.display = "none";
    document.querySelector(".restart-btn").style.display = "none";
    document.getElementById("score").textContent = `النتيجة: ${score}`;
    loadQuestion();
}

window.onload = function() { checkPendingData(); loadQuestion(); };
</script>
</body>
</html>
